<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Language Translator · Real‑time</title>
    <!-- Tailwind + fonts + icons (from second template) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- SignalR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e6e6ff 100%);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .video-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.05));
            pointer-events: none;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-active {
            background-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }
        .status-inactive {
            background-color: #EF4444;
        }
        .detection-box {
            transition: all 0.3s ease;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right, #f0f9ff, #e0f2fe);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .sentence-box {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .sentence-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #3B82F6, #2563EB);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .btn {
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 350px;
        }
        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }
        .notification.error {
            border-left: 4px solid #EF4444;
        }
        .notification.success {
            border-left: 4px solid #10B981;
        }
        .notification.info {
            border-left: 4px solid #3B82F6;
        }
        .mirror-video {
            transform: scaleX(-1);
        }
        /* extra padding for single sentence display */
        .accumulated-letters {
            font-family: monospace;
            background: #f8fafc;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-top: 0.25rem;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex items-center justify-center">
    <div class="card rounded-2xl p-6 sm:p-8 w-full max-w-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">
                Sign Language Translator
            </h1>
            <p class="text-gray-600">Real‑time detection – one sentence at a time</p>
        </div>

        <!-- Video stream area -->
        <div class="video-container mb-6">
            <video id="video" class="w-full h-auto block mirror-video" autoplay playsinline></video>
            <div class="video-overlay"></div>
        </div>

        <!-- Controls and status -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 p-4 bg-gray-50 rounded-xl">
            <div class="flex items-center">
                <span id="statusIndicator" class="status-indicator status-inactive"></span>
                <span id="statusMessage" class="text-gray-700 font-medium">Initializing...</span>
            </div>
            <div class="flex gap-2">
                <button id="startBtn" 
                        class="btn px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 w-full sm:w-auto pulse-animation">
                    <i class="fas fa-video"></i> Start
                </button>
                <button id="stopBtn" 
                        class="btn px-6 py-3 bg-gray-500 text-white font-semibold rounded-xl shadow-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>
        </div>

        <!-- Current letter (translation) + accumulated letters hint -->
        <div class="detection-box rounded-xl p-5 mb-6">
            <div class="text-center w-full">
                <p class="text-sm text-indigo-600 font-medium mb-1">CURRENT LETTER</p>
                <p id="translation" class="text-3xl font-bold text-indigo-800">—</p>
                <!-- small visual feedback of accumulated letters (optional) -->
                <div class="text-xs text-gray-500 mt-2">
                    Accumulated letters: <span id="accumulatedHint" class="font-mono bg-white px-2 py-1 rounded">—</span>
                </div>
            </div>
        </div>

        <!-- Final Sentence display (replaces word + sentence boxes) -->
        <div class="sentence-box bg-blue-50 rounded-xl p-5 mb-6">
            <p class="text-center font-medium text-blue-700 mb-2"><i class="fas fa-align-left mr-2"></i>FINAL SENTENCE</p>
            <p id="formedSentenceDisplay" class="text-center text-xl font-bold text-blue-900">—</p>
        </div>

        <!-- Action buttons: only Correct Sentence (finalize) and Generate Sound -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button id="correctSentenceBtn" 
                    class="btn px-4 py-3 bg-pink-100 text-pink-700 font-semibold rounded-lg hover:bg-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all col-span-1">
                <i class="fas fa-spell-check"></i> Correct Sentence
            </button>
            <button id="generateSoundBtn" 
                    class="btn px-4 py-3 bg-green-100 text-green-700 font-semibold rounded-lg hover:bg-green-200 focus:outline-none focus:ring-2 focus:ring-green-300 transition-all col-span-1">
                <i class="fas fa-volume-up"></i> Generate Sound
            </button>
        </div>

        <!-- Hidden audio player (for TTS) -->
        <audio id="audioPlayer" class="hidden"></audio>

        <!-- Optional clear link (soft reset) -->
        <div class="text-right mt-3">
            <button id="clearLettersBtn" class="text-xs text-gray-400 hover:text-gray-600 transition">
                <i class="far fa-trash-alt mr-1"></i>Clear accumulated letters
            </button>
        </div>
    </div>

    <!-- Notification toast -->
    <div id="notification" class="notification">
        <i class="fas fa-info-circle text-blue-500"></i>
        <div>
            <p class="font-medium" id="notification-title">Notification</p>
            <p class="text-sm text-gray-600 mt-1" id="notification-message"></p>
        </div>
        <button class="ml-auto text-gray-400 hover:text-gray-600" onclick="hideNotification()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        // ---------- DOM elements ----------
        const video = document.getElementById('video');
        const statusEl = document.getElementById('statusMessage');
        const statusIndicator = document.getElementById('statusIndicator');
        const translationEl = document.getElementById('translation');
        const formedSentenceEl = document.getElementById('formedSentenceDisplay');
        const accumulatedHint = document.getElementById('accumulatedHint');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const correctSentenceBtn = document.getElementById('correctSentenceBtn');
        const generateSoundBtn = document.getElementById('generateSoundBtn');
        const clearLettersBtn = document.getElementById('clearLettersBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        // ---------- State ----------
        let connection;                       // SignalR hub connection
        let intervalId = null;                // frame sender interval
        let stream = null;                     // webcam stream
        let isStreaming = false;               // camera active ?

        // cooldown to avoid duplicate letters
        let lastPrediction = '';
        let lastPredictionTime = 0;
        const COOLDOWN_MS = 1000;

        // Store the sequence of detected letters (raw accumulation)
        let accumulatedLetters = '';           // e.g., "ا ب ت"

        // The final processed sentence (after /finalize-sentence)
        let currentSentence = '';

        // Arabic label list (from second template)
        const arabicLabels = ["ع","ال","ا","ب","د","ظ","ض","ف","ق","غ","ه","ح","ج","ك","خ","لا","ل","م","ن","ر","ص","س","ش","ت","ط","ث","ذ","ة","و","ئ","ي","ز"];

        // API base – adjust if needed (relative by default)
        const API_BASE_URL = ' https://ema2a.mooo.com';  
        // SignalR hub URL (same as first snippet)
        const HUB_URL = `${API_BASE_URL}/signHub`;   // adjust as needed

        // ---------- Notification helpers ----------
        window.showNotification = function(title, message, type = 'info') {
            const notification = document.getElementById('notification');
            const titleEl = document.getElementById('notification-title');
            const messageEl = document.getElementById('notification-message');
            const icon = notification.querySelector('i');
            
            titleEl.textContent = title;
            messageEl.textContent = message;
            
            notification.className = 'notification';
            if (type === 'error') {
                notification.classList.add('error');
                icon.className = 'fas fa-exclamation-circle text-red-500';
            } else if (type === 'success') {
                notification.classList.add('success');
                icon.className = 'fas fa-check-circle text-green-500';
            } else {
                notification.classList.add('info');
                icon.className = 'fas fa-info-circle text-blue-500';
            }
            
            notification.classList.add('show');
            setTimeout(hideNotification, 5000);
        };

        window.hideNotification = function() {
            document.getElementById('notification').classList.remove('show');
        };

        // ---------- Update UI hint for accumulated letters ----------
        function updateAccumulatedHint() {
            if (accumulatedLetters && accumulatedLetters !== '') {
                accumulatedHint.textContent = accumulatedLetters.split('').join(' ');
            } else {
                accumulatedHint.textContent = '—';
            }
        }

        // ---------- SignalR initialization ----------
        async function initSignalR() {
            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl(HUB_URL, { withCredentials: true })
                    .configureLogging(signalR.LogLevel.Information)
                    .build();

                connection.on('ReceiveTranslation', (message) => {
                    // update current letter
                    translationEl.textContent = message || '—';

                    // accumulate letter if it's a valid arabic label and respects cooldown
                    if (arabicLabels.includes(message)) {
                        const now = Date.now();
                        if (message !== lastPrediction || (now - lastPredictionTime) > COOLDOWN_MS) {
                            // append to accumulated letters (store as plain string)
                            accumulatedLetters += message;
                            lastPrediction = message;
                            lastPredictionTime = now;

                            // update the hint display
                            updateAccumulatedHint();
                        }
                    }
                });

                connection.onclose(() => {
                    statusEl.textContent = 'Disconnected from hub';
                    statusIndicator.classList.replace('status-active','status-inactive');
                });

                await connection.start();
                statusEl.textContent = 'Connected to SignalR hub';
                statusIndicator.classList.replace('status-inactive','status-active');
                showNotification('SignalR', 'Connected to translation hub', 'success');
            } catch (err) {
                console.error('SignalR connection error:', err);
                statusEl.textContent = 'SignalR connection failed';
                statusIndicator.classList.replace('status-active','status-inactive');
                showNotification('Connection error', 'Could not connect to SignalR hub', 'error');
            }
        }

        // ---------- Webcam functions ----------
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                isStreaming = true;
                statusEl.textContent = 'Webcam active, sending frames...';
                statusIndicator.classList.replace('status-inactive','status-active');
                if (!connection || connection.state !== 'Connected') {
                    await initSignalR();
                }
                startDetection();
                showNotification('Camera', 'Webcam started', 'success');
            } catch (err) {
                console.error('Webcam error:', err);
                statusEl.textContent = 'Camera access denied';
                showNotification('Camera error', err.message, 'error');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            isStreaming = false;
            stopDetection();
            statusEl.textContent = 'Camera stopped';
            statusIndicator.classList.replace('status-active','status-inactive');
            translationEl.textContent = '—';
        }

        // ---------- Frame capture & sending via SignalR ----------
        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 480;
            canvas.height = video.videoHeight || 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        async function startDetection() {
            if (!connection || connection.state !== 'Connected') {
                showNotification('Warning', 'SignalR not connected, trying to reconnect...', 'info');
                try { await initSignalR(); } catch { return; }
            }
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(async () => {
                if (video.readyState >= 2 && isStreaming) {
                    const base64Image = captureFrame();
                    try {
                        await connection.invoke('ProcessFrame',{
                            imageData: base64Image
                        });
                    } catch (err) {
                        console.warn('Frame send error:', err);
                        if (err.message.includes('connection')) {
                            stopDetection();
                            statusEl.textContent = 'Connection lost';
                        }
                    }
                }
            }, 300);
        }

        function stopDetection() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        // ---------- REST API Helpers (audio) ----------
        const base64ToArrayBuffer = (base64) => {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
        };

        const pcmToWav = (pcmData, sampleRate) => {
            const pcm16 = new Int16Array(pcmData);
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);

            view.setUint32(0, 0x52494646, false); // "RIFF"
            view.setUint32(4, 36 + pcm16.length * 2, true);
            view.setUint32(8, 0x57415645, false); // "WAVE"
            view.setUint32(12, 0x666d7420, false); // "fmt "
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false); // "data"
            view.setUint32(40, pcm16.length * 2, true);

            const wavData = new Uint8Array(44 + pcm16.length * 2);
            wavData.set(new Uint8Array(wavHeader), 0);
            wavData.set(new Uint8Array(pcm16.buffer), 44);
            return new Blob([wavData], { type: 'audio/wav' });
        };

        // ---------- finalize-sentence endpoint (renamed from correctSentence) ----------
        async function finalizeSentence() {
            if (!accumulatedLetters || accumulatedLetters === '') {
                showNotification('Cannot finalize', 'No letters accumulated yet.', 'error');
                return;
            }

            statusEl.textContent = 'Finalizing sentence...';
            formedSentenceEl.textContent = 'Processing...';

            try {
                // Use the endpoint "finalize-sentence" as requested
                const response = await fetch(`${API_BASE_URL}/api/signlanguagetranslator/finalize-sentence`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sentence: accumulatedLetters })  // send raw letters
                });

                const result = await response.json();
                if (result.success && result.data)
                {
                    currentSentence = result.data;
                    formedSentenceEl.textContent = currentSentence;

                    showNotification('Success', 'Sentence finalized!', 'success');
                } else {
                    formedSentenceEl.textContent = '—';
                    showNotification('Finalize error', result.errorMessage || 'Could not process sentence', 'error');
                }
            } catch (error) {
                console.error(error);
                formedSentenceEl.textContent = '—';
                showNotification('Network error', 'Failed to call finalize-sentence', 'error');
            } finally {
                statusEl.textContent = isStreaming ? 'Webcam active, sending frames...' : 'Camera stopped';
            }
        }

        // ---------- Generate sound (unchanged) ----------
        async function generateSoundFromSentence() {
            if (!currentSentence || currentSentence === '—' || currentSentence === '') {
                showNotification('Audio Error', 'No finalized sentence to generate audio for.', 'error');
                return;
            }
            statusEl.textContent = 'Generating audio...';
            generateSoundBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/api/signlanguagetranslator/generate-audio`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: currentSentence })
                });
                const result = await response.json();
                if (result.success && result.data) {
                    const pcmData = base64ToArrayBuffer(result.data.audioData);
                    const wavBlob = pcmToWav(pcmData, result.data.sampleRate);
                    audioPlayer.src = URL.createObjectURL(wavBlob);
                    audioPlayer.play();
                    showNotification('Audio', 'Playing generated speech', 'success');
                } else {
                    showNotification('Audio Error', result.errorMessage || 'Generation failed', 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('Audio Error', 'Request failed', 'error');
            } finally {
                generateSoundBtn.disabled = false;
                statusEl.textContent = isStreaming ? 'Webcam active, sending frames...' : 'Camera stopped';
            }
        }

        // ---------- Clear accumulated letters (soft reset) ----------
        function clearAccumulated() {
            accumulatedLetters = '';
            lastPrediction = '';
            lastPredictionTime = 0;
            translationEl.textContent = '—';
            updateAccumulatedHint();
            showNotification('Cleared', 'Accumulated letters reset', 'info');
        }

        // ---------- Button event bindings ----------
        startBtn.addEventListener('click', () => {
            if (!isStreaming) startCamera();
        });

        stopBtn.addEventListener('click', () => {
            if (isStreaming) stopCamera();
        });

        // Correct Sentence now uses finalize-sentence
        correctSentenceBtn.addEventListener('click', finalizeSentence);

        generateSoundBtn.addEventListener('click', generateSoundFromSentence);

        clearLettersBtn.addEventListener('click', clearAccumulated);

        // ---------- Load & init ----------
        (async () => {
            await initSignalR();
            statusEl.textContent = 'Ready. Click Start.';
        })();

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (isStreaming) stopCamera();
        });
    </script>
</body>
</html>
