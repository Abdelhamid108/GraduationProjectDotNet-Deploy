# ============================================================
# SonarCloud — DevOps (Terraform + Ansible + Docker + Compose)
# ============================================================
sonar.projectKey=Abdelhamid108_ema2a-devops
sonar.organization=abdelhamid108
sonar.projectName=Ema2a DevOps

# Sources — DevOps configs + Dockerfiles + Compose files
# Paths are relative to the repository root (sonar.projectBaseDir is set to repo root in CI)
sonar.sources=DevOps,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.local.yml,docker-compose-backup-deployment.yml

# Exclusions — don't scan Terraform lock files or .terraform cache
sonar.exclusions=**/.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/*.tfplan,**/.terraform.lock.hcl
