# ============================================================
# SonarCloud — Frontend (React 19 + TypeScript) + DevOps
# Combined project: frontend source + all IaC & Docker files
# ============================================================
sonar.projectKey=Abdelhamid108_ema2a-frontend-devops
sonar.organization=abdelhamid108
sonar.projectName=Ema2a Frontend & DevOps

# Sources — relative to repo root (projectBaseDir = .)
sonar.sources=frontend/src,DevOps,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml,docker-compose.local.yml,docker-compose-backup-deployment.yml

# TypeScript config for the frontend portion
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# Exclusions — node_modules, dist, Terraform state & cache
sonar.exclusions=**/node_modules/**,**/dist/**,**/.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/*.tfplan,**/.terraform.lock.hcl

# If coverage is added later (Vitest → lcov):
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
