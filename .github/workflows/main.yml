name: Ema2a-Pipeline
on:
  push:
    branches:
      - "DEV"
      - "main"
    paths:
      - "backend/**"
      - "nginx-proxy/**"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      FiRST-RUN:
        description: 'Set to true to force build all images'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: 'abdelhameed208'
  BACKEND_IMAGE: 'graduationproject-backend'
  WEB_SERVER_IMAGE: 'graduationproject-nginx'

jobs:
  # ====================================================
  # JOB 1: BUILD & PUSH
  # ====================================================
  build-push-images:
    runs-on: ubuntu-24.04
    steps:
      - name: download-code
        uses: actions/checkout@v6.0.2  # Use latest stable checkout version
        with:
          fetch-depth: 0 

      - name: check what changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            web-server:
              - 'nginx-proxy/**'
            docker-compose:
              - 'docker-compose.yml'

      - name: sign to docker hub
        if: |
          steps.changes.outputs.backend == 'true' || 
          steps.changes.outputs.web-server == 'true' || 
          inputs.FiRST-RUN == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- BACKEND ---
      - name: build and push backend image 
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        run: | 
          BACKEND_COUNT=$(git rev-list --count HEAD backend/ || echo "0")
          BACKEND_SHORT_SHA=$(git rev-parse --short HEAD)
          BACKEND_TAG="v1.0-${BACKEND_COUNT}-${BACKEND_SHORT_SHA}"  
          echo "Calculated tag: $BACKEND_TAG"

          docker build -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG ./backend
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG
          
          docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
      
      # --- WEB SERVER ---
      - name: build and push WEB_SERVER images 
        if: steps.changes.outputs.web-server == 'true' || inputs.FiRST-RUN == true
        run: | 
          WEB_SERVER_COUNT=$(git rev-list --count HEAD nginx-proxy/ || echo "0")
          WEB_SERVER_SHORT_SHA=$(git rev-parse --short HEAD)
          WEB_SERVER_TAG="v1.0-${WEB_SERVER_COUNT}-${WEB_SERVER_SHORT_SHA}"  
          echo "Calculated tag: $WEB_SERVER_TAG"

          docker build -t ${{ env.REGISTRY }}/${{ env.WEB_SERVER_IMAGE }}:$WEB_SERVER_TAG ./nginx-proxy
          docker push ${{ env.REGISTRY }}/${{ env.WEB_SERVER_IMAGE }}:$WEB_SERVER_TAG

          docker tag ${{ env.REGISTRY }}/${{ env.WEB_SERVER_IMAGE }}:$WEB_SERVER_TAG ${{ env.REGISTRY }}/${{ env.WEB_SERVER_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.WEB_SERVER_IMAGE }}:latest

  # ====================================================
  # JOB 2: DEPLOY
  # ====================================================
  deploy:
    runs-on: ubuntu-24.04
    needs: build-push-images       # CRITICAL: Wait for build to finish
    if: success() 
    steps:
      - name: checkout_code
        uses: actions/checkout@v6.0.2

      - name: generate-env-file
        run: |
          # Generate .env file from GitHub Secret
          echo "${{ secrets.EMA2A_ENV_FILE_CONTENT }}" > .env
          ls -la

      # 1. Ensure target directory exists
      - name: ensure app folder created 
        uses: appleboy/ssh-action@v1.0.3 
        with:
          host: ${{ secrets.EMA2A_SSH_HOST }}
          username: ${{ secrets.EMA2A_SSH_USER }}
          key: ${{ secrets.EMA2A_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.EMA2A_SSH_USER }}/app
            
      # 2. Copy files to server
      - name: copy files using scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EMA2A_SSH_HOST }}
          username: ${{ secrets.EMA2A_SSH_USER }}
          key: ${{ secrets.EMA2A_PRIVATE_KEY }} 
          source: "docker-compose.yml,.env"
          target: "/home/${{ secrets.EMA2A_SSH_USER }}/app/"

      # 3. Execute Deployment
      - name: deploy 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EMA2A_SSH_HOST }}
          username: ${{ secrets.EMA2A_SSH_USER }}
          key: ${{ secrets.EMA2A_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EMA2A_SSH_USER }}/app/
            
            # Pull new images
            docker compose pull
            
            # Restart containers (recreate only what changed)
            docker compose up -d --remove-orphans
            
            # Cleanup unused images to save disk space
            docker image prune -f
