name: Ema2a-Pipeline

# ------------------------------------------------------------------------------
# TRIGGER CONFIGURATION
# Defines when the pipeline should run: on specific branch pushes, 
# file changes, or triggered manually via the GitHub Actions UI.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - "DEV"
      - "main"
    paths:
      - "backend/**"
      - "frontend/**"
      - "DevOps/**"
      - "docker-compose*.yml"
      - "**/Dockerfile"
  workflow_dispatch:
    inputs:
      FiRST-RUN:
        description: 'Set to true to force build all images ignoring path filters'
        required: false
        default: false
        type: boolean

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
env:
  REGISTRY: 'abdelhameed208'
  BACKEND_IMAGE: 'graduationproject-backend'
  FRONTEND_IMAGE: 'graduationproject-frontend'

jobs:

  # ============================================================================
  # SAST GATE — 2 parallel SonarCloud jobs.
  # build-push-images waits for BOTH before proceeding.
  # Hardware and Flutter are analyzed in their own dedicated workflow files.
  # ============================================================================

  # ---------------------------------------------------------------------------
  # SAST JOB 1 — Backend (.NET 8 / ASP.NET Core)
  # Uses the official dotnet-sonarscanner MSBuild wrapper (begin → build → end)
  # ---------------------------------------------------------------------------
  sonar-backend:
    name: 'Sonar · Backend (.NET)'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Create Backend .env File
        run: echo "${{ secrets.EMA2A_ENV_FILE_CONTENT }}" > ./backend/.env

      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ./backend
          dotnet-sonarscanner begin \
            /k:"Abdelhamid108_GraduationProjectDotNet-Deploy" \
            /o:"abdelhamid108" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"
          dotnet build
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ---------------------------------------------------------------------------
  # SAST JOB 2 — Frontend (React/TS) + DevOps (Terraform, Ansible, Docker)
  # Combined into one SonarCloud project. Runs from repo root.
  # Config: sonar-frontend-devops.properties
  # ---------------------------------------------------------------------------
  sonar-frontend-devops:
    name: 'Sonar · Frontend + DevOps'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Install frontend deps so Sonar can resolve TypeScript types
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install SonarScanner CLI
        run: npm install -g sonar-scanner

      # Run from repo root — sonar-frontend-devops.properties references
      # both frontend/src and DevOps/** with paths relative to repo root
      - name: Run Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dproject.settings=sonar-frontend-devops.properties \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.host.url="https://sonarcloud.io"

  # ============================================================================
  # JOB 2: BUILD & PUSH
  # Builds Docker images conditionally based on changed paths and pushes them
  # to Docker Hub with immutable, traceable tags.
  # Strictly compiles TWO separate Frontend images to guarantee perfect URL
  # resolution in both Azure and AWS.
  # ============================================================================
  build-push-images:
    runs-on: ubuntu-24.04
    needs: [sonar-backend, sonar-frontend-devops]
    if: success()
    outputs:
      backend_tag: ${{ steps.build_backend.outputs.tag }}
      frontend_azure_tag: ${{ steps.build_frontend.outputs.azure_tag }}
      frontend_aws_tag: ${{ steps.build_frontend.outputs.aws_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optimizes pipeline duration by detecting which microservices actually changed
      - name: Detect File Changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docker-compose:
              - 'docker-compose.yml'

      - name: Authenticate to Docker Hub
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.frontend == 'true' ||
          inputs.FiRST-RUN == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- BACKEND BUILD ---
      - name: Build and Push Backend Image
        id: build_backend
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        run: |
          # Generate an immutable tag using commit count and short SHA for traceability
          BACKEND_COUNT=$(git rev-list --count HEAD backend/ || echo "0")
          BACKEND_SHORT_SHA=$(git rev-parse --short HEAD)
          BACKEND_TAG="v1.0-${BACKEND_COUNT}-${BACKEND_SHORT_SHA}"

          docker build -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG ./backend
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG

          # Push 'latest' tag as a secondary reference
          docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:$BACKEND_TAG ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

          # Export the unique tag to be used in the deployment job
          echo "tag=$BACKEND_TAG" >> $GITHUB_OUTPUT

      # --- FRONTEND BUILD (THE TWO-IMAGE STRATEGY) ---
      - name: Build and Push Frontend Images (Azure & AWS)
        id: build_frontend
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        run: |
          FRONTEND_COUNT=$(git rev-list --count HEAD frontend/ || echo "0")
          FRONTEND_SHORT_SHA=$(git rev-parse --short HEAD)
          FRONTEND_BASE_TAG="v1.0-${FRONTEND_COUNT}-${FRONTEND_SHORT_SHA}"

          # 1. Compile exactly for AZURE
          AZURE_TAG="${FRONTEND_BASE_TAG}-azure"
          docker build --build-arg VITE_BASE_URI=${{ secrets.VITE_BASE_URI_AZURE }} -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$AZURE_TAG ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$AZURE_TAG

          # 2. Compile exactly for AWS Disaster Recovery
          AWS_TAG="${FRONTEND_BASE_TAG}-aws"
          docker build --build-arg VITE_BASE_URI=${{ secrets.VITE_BASE_URI_AWS }} -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$AWS_TAG ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$AWS_TAG

          # Push the AWS image as 'latest' so the local Integration Test Job 
          # can easily pull it via docker-compose
          docker tag ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$AWS_TAG ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

          # Export specific tags for the deployment phase
          echo "azure_tag=$AZURE_TAG" >> $GITHUB_OUTPUT
          echo "aws_tag=$AWS_TAG" >> $GITHUB_OUTPUT
  # ============================================================================
  # JOB 2: SECURITY TESTING 
  # Using DevSecOps tools for Security Scaning, 
  # ============================================================================
  security_test:
    runs-on: ubuntu-24.04
    needs: build-push-images
    permissions:
      contents: read         
      security-events: write   
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Scan Backend Image Using Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        if: needs.build-push-images.outputs.backend_tag != ''
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-push-images.outputs.backend_tag }}
          exit-code: 0
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          scanners: 'vuln,secret'
          
      - name: Upload Backend Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: needs.build-push-images.outputs.backend_tag != ''
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'    
          
      - name: Scan Frontend Image Using Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        if: needs.build-push-images.outputs.frontend_azure_tag != ''
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-push-images.outputs.frontend_azure_tag }}
          exit-code: 0
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          scanners: 'vuln,secret'

      - name: Upload Frontend Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: needs.build-push-images.outputs.frontend_azure_tag != ''
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'   
          
          
  # ============================================================================
  # JOB 3: INTEGRATION TESTING & ARTIFACT STORAGE
  # Spins up an ephemeral environment, runs tests, uploads artifacts to Azure, 
  # notifies stakeholders, and enforces a Quality Gate.
  # ============================================================================
  test:
    runs-on: ubuntu-24.04
    needs: [build-push-images,security_test]
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Ephemeral Test Environment
        run: |
          echo "${{ secrets.EMA2A_ENV_FILE_CONTENT }}" >> .env
          docker compose up -d
          # Wait for services to fully initialize
          sleep 120

      - name: Install Testing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          # Install websocat for WebSocket testing
          wget -qO /tmp/websocat https://github.com/vi/websocat/releases/latest/download/websocat.x86_64-unknown-linux-musl
          chmod +x /tmp/websocat && sudo mv /tmp/websocat /usr/local/bin/

      - name: Execute API Tests
        run: |
          cd ./backend/API_Test
          chmod +x run_tests.sh
          # Use '|| true' to prevent pipeline crash, ensuring reports are always collected
          ./run_tests.sh --verbose --base-url http://localhost || true

      - name: Parse Test Report JSON
        id: test_results
        run: |
          # Resolve symlink to get the timestamped report file
          LATEST_REPORT=$(readlink -f "./backend/API_Test/reports/report_latest.json")
          
          # Extract metrics using jq
          TOTAL=$(jq -r '.summary.total' $LATEST_REPORT)
          PASSED=$(jq -r '.summary.passed' $LATEST_REPORT)
          FAILED=$(jq -r '.summary.failed' $LATEST_REPORT)
          PASS_RATE=$(jq -r '.summary.pass_rate' $LATEST_REPORT)

          # Export metrics for subsequent steps
          echo "report_file=$LATEST_REPORT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT

      - name: Authenticate to Azure
        if: always()
        uses: Azure/login@v2
        continue-on-error: true
        with:
          creds: "${{ secrets.AZURE_CREDENTIALS }}"

      - name: Upload Test Artifacts to Azure Blob Storage
        if: always()
        id: upload_blob  
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            REPORT_PATH=${{ steps.test_results.outputs.report_file }}
            FILE_NAME=$(basename "$REPORT_PATH")

            echo "Uploading test report: $FILE_NAME"
            
            # 1. Upload to Azure Blob Storage (Private)
            az storage blob upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
              --file $REPORT_PATH \
              --name "reports/$FILE_NAME" \
              --auth-mode login

            # 2. Create User Delegation SAS Token (Valid for 24 Hours)
            EXPIRY=$(date -u -d '24 hours' +%Y-%m-%dT%H:%MZ)
            SAS_URL=$(az storage blob generate-sas \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
              --name "reports/$FILE_NAME" \
              --permissions r \
              --expiry $EXPIRY \
              --as-user \
              --full-uri -otsv \
              --auth-mode login)

            echo "sas_url=$SAS_URL" >> $GITHUB_OUTPUT  

      - name: Send Notification Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_ACCOUNT }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Ema2a CI/CD <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.TARGET_EMAIL }}
          subject: Ema2a Pipeline Test Results (${{ steps.test_results.outputs.pass_rate }})
          body: |
            Test execution for Ema2a has completed.

            Test Summary:
            ✅ Passed: ${{ steps.test_results.outputs.passed }}
            ❌ Failed: ${{ steps.test_results.outputs.failed }}
            🔄 Total: ${{ steps.test_results.outputs.total }}
            📈 Pass Rate: ${{ steps.test_results.outputs.pass_rate }}

            ${{ steps.upload_blob.outcome == 'success' && format('🔗 Secure Artifact Access (Expires in 24h)\n{0}', steps.upload_blob.outputs.sas_url) || '⚠️ Note: Azure Upload failed. Artifact link unavailable.' }}

            Note Access is restricted. Link is generated dynamically for security.

      - name: Enforce Quality Gate (Pass/Fail Threshold)
        run: |
          FAILED_TESTS=${{ steps.test_results.outputs.failed }}
          ALLOWED_FAILURES=10 
          
          if [ "$FAILED_TESTS" -gt "$ALLOWED_FAILURES" ]; then
            echo "❌ Pipeline failed! ($FAILED_TESTS) tests failed. Deployment aborted."
            exit 1
          else
            echo "✅ Quality gate passed! Proceeding to Deployment."
            exit 0
          fi


  # ============================================================================
  # JOB 3: DEPLOYMENT
  # Deploys the immutable image tags to Azure Container Apps. 
  # Requires manual approval via GitHub Environments.
  # Uses the specific *-azure frontend tag built in Job 1.
  # ============================================================================
  deploy:
    runs-on: ubuntu-24.04
    # Strict dependency mapping: Deploy only if Build and Test succeed
    needs: [build-push-images, test,security_test]
    environment: Production
    if: success()
    steps:
      - name: Authenticate to Azure
        uses: Azure/login@v2
        with:
          creds: "${{ secrets.AZURE_CREDENTIALS }}"

      - name: Deploy Backend to Azure Container Apps
        if: needs.build-push-images.outputs.backend_tag != ''
        uses: Azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-push-images.outputs.backend_tag }}
          containerAppName: ema2a
          resourceGroup: Ema2a

      - name: Deploy Frontend to Azure Container Apps
        if: needs.build-push-images.outputs.frontend_azure_tag != ''
        uses: Azure/container-apps-deploy-action@v2
        with:
          # Crucial: This specifically pulls the tag compiled with the Azure URL
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-push-images.outputs.frontend_azure_tag }}
          containerAppName: ema2a-webserver
          resourceGroup: Ema2a
