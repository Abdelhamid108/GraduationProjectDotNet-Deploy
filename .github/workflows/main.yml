name: Ema2a-Pipeline

# ------------------------------------------------------------------------------
# TRIGGER CONFIGURATION
# Defines when the pipeline should run: on specific branch pushes, 
# file changes, or triggered manually via the GitHub Actions UI.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - "DEV"
      - "main"
    paths:
      - "backend/**"
      - "frontend/**"
      - "DevOps/**"
      - "docker-compose*.yml"
      - "**/Dockerfile"
  workflow_dispatch:
    inputs:
      FiRST-RUN:
        description: 'Set to true to force build all images ignoring path filters'
        required: false
        default: false
        type: boolean

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
env:
  REGISTRY: 'abdelhameed208'
  BACKEND_IMAGE: 'graduationproject-backend'
  FRONTEND_IMAGE: 'graduationproject-frontend'

jobs:

  # ============================================================================
  # SAST GATE — 2 parallel SonarCloud jobs.
  # build-push-images waits for BOTH before proceeding.
  # Hardware and Flutter are analyzed in their own dedicated workflow files.
  # ============================================================================

  # ---------------------------------------------------------------------------
  # SAST JOB 1 — Backend (.NET 8 / ASP.NET Core)
  # Uses the official dotnet-sonarscanner MSBuild wrapper (begin → build → end)
  # ---------------------------------------------------------------------------
  sonar-backend:
    name: 'Sonar · Backend (.NET)'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud Packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Create Backend .env File
        run: echo "${{ secrets.EMA2A_ENV_FILE_CONTENT }}" > ./backend/.env

      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ./backend
          dotnet-sonarscanner begin \
            /k:"Abdelhamid108_GraduationProjectDotNet-Deploy" \
            /o:"abdelhamid108" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"
          dotnet build
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ---------------------------------------------------------------------------
  # SAST JOB 2 — Frontend (React/TS) + DevOps (Terraform, Ansible, Docker)
  # Combined into one SonarCloud project. Runs from repo root.
  # Config: sonar-frontend-devops.properties
  # ---------------------------------------------------------------------------
  sonar-frontend-devops:
    name: 'Sonar · Frontend + DevOps'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache SonarCloud Packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Install frontend deps so Sonar can resolve TypeScript types
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install SonarScanner CLI
        run: npm install -g sonar-scanner

      # Run from repo root — sonar-frontend-devops.properties references
      # both frontend/src and DevOps/** with paths relative to repo root
      - name: Run Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dproject.settings=sonar-frontend-devops.properties \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.host.url="https://sonarcloud.io"

  # ============================================================================
  # JOB: BACKEND BUILD & PUSH
  # Builds the .NET Docker image independently and pushes to Docker Hub.
  # Runs in parallel with frontend-build-push.
  # Skips automatically when no backend/** files changed.
  # ============================================================================
  backend-build-push:
    name: 'Build & Push · Backend (.NET)'
    runs-on: ubuntu-24.04
    needs: [sonar-backend, sonar-frontend-devops]
    if: success()
    outputs:
      backend_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Backend Changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'

      # BuildKit enables layer caching and faster rebuilds
      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Docker Hub
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Immutable Image Tag
        id: tag
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        run: |
          COUNT=$(git rev-list --count HEAD backend/ || echo "0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "value=v1.0-${COUNT}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      # docker/build-push-action handles BuildKit layer caching via registry
      # cache-from restores cached layers; cache-to saves them after build
      - name: Build and Push Backend Image
        if: steps.changes.outputs.backend == 'true' || inputs.FiRST-RUN == true
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache,mode=max

  # ============================================================================
  # JOB: FRONTEND BUILD & PUSH
  # Builds TWO React images (Azure + AWS) with different VITE_BASE_URI args.
  # Runs in parallel with backend-build-push.
  # Skips automatically when no frontend/** files changed.
  # ============================================================================
  frontend-build-push:
    name: 'Build & Push · Frontend (React)'
    runs-on: ubuntu-24.04
    needs: [sonar-backend, sonar-frontend-devops]
    if: success()
    outputs:
      frontend_azure_tag: ${{ steps.tag.outputs.azure_tag }}
      frontend_aws_tag: ${{ steps.tag.outputs.aws_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Frontend Changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref_name }}
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Docker Hub
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Immutable Image Tags
        id: tag
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        run: |
          COUNT=$(git rev-list --count HEAD frontend/ || echo "0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE="v1.0-${COUNT}-${SHORT_SHA}"
          echo "azure_tag=${BASE}-azure" >> $GITHUB_OUTPUT
          echo "aws_tag=${BASE}-aws" >> $GITHUB_OUTPUT

      # --- IMAGE 1: Compiled for AZURE ---
      - name: Build and Push Frontend Image (Azure)
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: VITE_BASE_URI=${{ secrets.VITE_BASE_URI_AZURE }}
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.azure_tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:buildcache-azure
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:buildcache-azure,mode=max

      # --- IMAGE 2: Compiled for AWS (also tagged :latest for integration tests) ---
      - name: Build and Push Frontend Image (AWS)
        if: steps.changes.outputs.frontend == 'true' || inputs.FiRST-RUN == true
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: VITE_BASE_URI=${{ secrets.VITE_BASE_URI_AWS }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.aws_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:buildcache-aws
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:buildcache-aws,mode=max
  
  # ============================================================================
  # SECURITY JOB: TRIVY — Backend
  # Scans the pushed .NET image. Runs immediately after backend-build-push,
  # fully independent of the frontend pipeline.
  # ============================================================================
  trivy-backend:
    name: 'Trivy · Backend Image Scan'
    runs-on: ubuntu-24.04
    needs: backend-build-push
    permissions:
      contents: read
      security-events: write
    if: success()
    # Pass the image tag downstream so deploy can reference it
    # without needing a direct dependency on backend-build-push
    outputs:
      backend_tag: ${{ needs.backend-build-push.outputs.backend_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.35.0
        if: needs.backend-build-push.outputs.backend_tag != ''
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.backend-build-push.outputs.backend_tag }}
          exit-code: 0
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-backend.sarif'
          scanners: 'vuln,secret'

      - name: Upload Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: needs.backend-build-push.outputs.backend_tag != ''
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

  # ============================================================================
  # SECURITY JOB: TRIVY — Frontend
  # Scans the pushed React (Azure) image. Runs immediately after
  # frontend-build-push, fully independent of the backend pipeline.
  # ============================================================================
  trivy-frontend:
    name: 'Trivy · Frontend Image Scan'
    runs-on: ubuntu-24.04
    needs: frontend-build-push
    permissions:
      contents: read
      security-events: write
    if: success()
    # Pass image tags downstream so deploy can reference them
    # without needing a direct dependency on frontend-build-push
    outputs:
      frontend_azure_tag: ${{ needs.frontend-build-push.outputs.frontend_azure_tag }}
      frontend_aws_tag: ${{ needs.frontend-build-push.outputs.frontend_aws_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.35.0
        if: needs.frontend-build-push.outputs.frontend_azure_tag != ''
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.frontend-build-push.outputs.frontend_azure_tag }}
          exit-code: 0
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          scanners: 'vuln,secret'

      - name: Upload Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: needs.frontend-build-push.outputs.frontend_azure_tag != ''
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'   
          
          
  # ============================================================================
  # JOB 3: INTEGRATION TESTING & ARTIFACT STORAGE
  # Spins up an ephemeral environment, runs tests, uploads artifacts to Azure, 
  # notifies stakeholders, and enforces a Quality Gate.
  # ============================================================================
  test:
    runs-on: ubuntu-24.04
    needs: [trivy-backend, trivy-frontend]
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Ephemeral Test Environment
        run: |
          echo "${{ secrets.EMA2A_ENV_FILE_CONTENT }}" >> .env
          docker compose up -d
          # Wait for services to fully initialize
          sleep 120

      - name: Install Testing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          # Install websocat for WebSocket testing
          wget -qO /tmp/websocat https://github.com/vi/websocat/releases/latest/download/websocat.x86_64-unknown-linux-musl
          chmod +x /tmp/websocat && sudo mv /tmp/websocat /usr/local/bin/

      - name: Execute API Tests
        run: |
          cd ./backend/API_Test
          chmod +x run_tests.sh
          # Use '|| true' to prevent pipeline crash, ensuring reports are always collected
          ./run_tests.sh --verbose --base-url http://localhost || true

      - name: Parse Test Report JSON
        id: test_results
        run: |
          # Resolve symlink to get the timestamped report file
          LATEST_REPORT=$(readlink -f "./backend/API_Test/reports/report_latest.json")
          
          # Extract metrics using jq
          TOTAL=$(jq -r '.summary.total' $LATEST_REPORT)
          PASSED=$(jq -r '.summary.passed' $LATEST_REPORT)
          FAILED=$(jq -r '.summary.failed' $LATEST_REPORT)
          PASS_RATE=$(jq -r '.summary.pass_rate' $LATEST_REPORT)

          # Export metrics for subsequent steps
          echo "report_file=$LATEST_REPORT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT

      - name: Authenticate to Azure
        if: always()
        uses: Azure/login@v3
        continue-on-error: true
        with:
          creds: "${{ secrets.AZURE_CREDENTIALS }}"

      - name: Upload Test Artifacts to Azure Blob Storage
        if: always()
        id: upload_blob  
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            REPORT_PATH=${{ steps.test_results.outputs.report_file }}
            FILE_NAME=$(basename "$REPORT_PATH")

            echo "Uploading test report: $FILE_NAME"
            
            # 1. Upload to Azure Blob Storage (Private)
            az storage blob upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
              --file $REPORT_PATH \
              --name "reports/$FILE_NAME" \
              --auth-mode login

            # 2. Create User Delegation SAS Token (Valid for 24 Hours)
            EXPIRY=$(date -u -d '24 hours' +%Y-%m-%dT%H:%MZ)
            SAS_URL=$(az storage blob generate-sas \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
              --name "reports/$FILE_NAME" \
              --permissions r \
              --expiry $EXPIRY \
              --as-user \
              --full-uri -otsv \
              --auth-mode login)

            echo "sas_url=$SAS_URL" >> $GITHUB_OUTPUT  

      - name: Send Notification Email
        if: always()
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_ACCOUNT }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Ema2a CI/CD <${{ secrets.EMAIL_USERNAME }}>
          to: ${{ secrets.TARGET_EMAIL }}
          subject: Ema2a Pipeline Test Results (${{ steps.test_results.outputs.pass_rate }})
          body: |
            Test execution for Ema2a has completed.

            Test Summary:
            ✅ Passed: ${{ steps.test_results.outputs.passed }}
            ❌ Failed: ${{ steps.test_results.outputs.failed }}
            🔄 Total: ${{ steps.test_results.outputs.total }}
            📈 Pass Rate: ${{ steps.test_results.outputs.pass_rate }}

            ${{ steps.upload_blob.outcome == 'success' && format('🔗 Secure Artifact Access (Expires in 24h)\n{0}', steps.upload_blob.outputs.sas_url) || '⚠️ Note: Azure Upload failed. Artifact link unavailable.' }}

            Note Access is restricted. Link is generated dynamically for security.

      - name: Enforce Quality Gate (Pass/Fail Threshold)
        run: |
          FAILED_TESTS=${{ steps.test_results.outputs.failed }}
          ALLOWED_FAILURES=10 
          
          if [ "$FAILED_TESTS" -gt "$ALLOWED_FAILURES" ]; then
            echo "❌ Pipeline failed! ($FAILED_TESTS) tests failed. Deployment aborted."
            exit 1
          else
            echo "✅ Quality gate passed! Proceeding to Deployment."
            exit 0
          fi


  # ============================================================================
  # JOB 3: DEPLOYMENT
  # Deploys the immutable image tags to Azure Container Apps. 
  # Requires manual approval via GitHub Environments.
  # Uses the specific *-azure frontend tag built in Job 1.
  # ============================================================================
  deploy_main:
    runs-on: ubuntu-24.04
    # Strict dependency mapping: Deploy only if Build and Test succeed
    needs: [trivy-backend, trivy-frontend, test]
    environment: "Production - Main"
    if: success() 
    steps:
      - name: Authenticate to Azure
        uses: Azure/login@v3
        with:
          creds: "${{ secrets.AZURE_CREDENTIALS }}"

      - name: Deploy Backend to Azure Container Apps
        if: needs.trivy-backend.outputs.backend_tag != ''
        uses: Azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.trivy-backend.outputs.backend_tag }}
          containerAppName: ema2a
          resourceGroup: Ema2a

      - name: Deploy Frontend to Azure Container Apps
        if: needs.trivy-frontend.outputs.frontend_azure_tag != ''
        uses: Azure/container-apps-deploy-action@v2
        with:
          # Crucial: This specifically pulls the tag compiled with the Azure URL
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.trivy-frontend.outputs.frontend_azure_tag }}
          containerAppName: ema2a-webserver
          resourceGroup: Ema2a
  
  deploy_backup:
    runs-on: ubuntu-24.04
    needs: [trivy-backend, trivy-frontend, test]
    environment: "Production - Backup"
    
    # CRITICAL: Required for AWS OIDC authentication to work
    permissions:
      id-token: write
      contents: read
      
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }} # Don't forget to swap this with your real EC2 ID
    if: success()
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_RULE }}
          aws-region: us-east-1

      # Step 1: Check the state and save it as an output variable
      - name: Check EC2 Instance State
        id: ec2_state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current instance state: $STATE"

          # This syntax saves the state so the next step can read it
          echo "state=$STATE" >> $GITHUB_OUTPUT

      # Step 2: Call the API Gateway ONLY if the instance is stopped
      - name: Start Instance via API Gateway
        if: steps.ec2_state.outputs.state == 'stopped'
        env:
          API_URL: "https://start.ema2a.website"
        run: |
          echo "Instance is stopped. Calling API Gateway to start it..."

          # Call the webhook (add headers like -H "x-api-key: YOUR_KEY" if your API is secured)
          curl "$API_URL"

          echo "Start signal sent. Waiting for AWS to register the instance as 'running'..."
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          echo "Instance is now running! Waiting 45 seconds for the OS and SSM Agent to fully boot..."
          sleep 45

      # Step 3: Restart the Systemd service
      - name: Deploy via AWS SSM (Restart Service)
        run: |
          echo "Proceeding with deployment..."

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=["systemctl restart ema2a-app.service"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Triggered SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish executing
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Fetch the output logs to display in GitHub Actions
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
