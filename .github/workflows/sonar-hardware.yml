name: Sonar · Hardware Service

# -----------------------------------------------------------------------
# Triggered ONLY when Hardware-Service code changes.
# Runs independently from the main CI/CD pipeline.
# -----------------------------------------------------------------------
on:
  push:
    branches:
      - "DEV"
      - "main"
    paths:
      - "Hardware-Service/**"
  pull_request:
    branches:
      - "DEV"
      - "main"
    paths:
      - "Hardware-Service/**"
  workflow_dispatch:

jobs:
  sonar-hardware:
    name: 'Sonar · Hardware (Python)'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # SonarScanner requires JDK 17 as its runtime
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarCloud Packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner CLI
        run: npm install -g sonar-scanner

      - name: Run Sonar Analysis
        working-directory: Hardware-Service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.host.url="https://sonarcloud.io"
